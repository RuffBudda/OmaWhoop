name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Qt QML tools
        run: sudo apt-get update -q && sudo apt-get install -y -q qt6-declarative-dev-tools jq
      - name: Run checks
        run: tools/check
